<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PMSI+ — Aide au codage PMSI</title>
  <meta
    name="description"
    content="Référentiels d'aide au codage PMSI du CHU de Brest : intoxications, germes, actes CCAM, contexte patient, acronymes."
  />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="PMSI+ — Aide au codage PMSI" />
  <meta
    property="og:description"
    content="Référentiels d'aide au codage PMSI du CHU de Brest : intoxications, germes, actes CCAM, contexte patient, acronymes."
  />
  <meta property="og:type" content="website" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6df6'/%3E%3Cpath d='M13 8h3v5h5v3h-5v5h-3v-5H8v-3h5z' fill='white'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Thème posé avant le premier rendu : lu depuis localStorage, sans quoi
       une page en mode sombre clignoterait en clair au chargement. -->
  <script>
    try {
      const choix = localStorage.getItem("pmsi-theme");
      if (choix === "clair" || choix === "sombre") {
        document.documentElement.dataset.theme = choix;
      }
    } catch (_) {}
  </script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="barre-haute">
    <button
      id="bascule-barre-laterale"
      class="bouton-icone"
      type="button"
      aria-controls="barre-laterale"
      aria-expanded="false"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      Thèmes
    </button>
    <span class="barre-haute-titre">PMSI+</span>
  </header>

  <div id="mise-en-page" class="mise-en-page">
    <div id="voile" class="voile" aria-hidden="true"></div>

    <aside id="barre-laterale" class="barre-laterale">
      <div class="marque">
        <span class="marque-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="currentColor" />
          </svg>
        </span>
        <span class="marque-textes">
          <span class="app-titre">PMSI+</span>
          <span class="app-etablissement">DIM — CHU de Brest</span>
        </span>
      </div>

      <nav id="nav-themes" aria-label="Thèmes"></nav>

      <div class="barre-laterale-pied">
        <button id="bascule-theme" class="bouton-icone bouton-theme" type="button">
          <span class="icone-theme" aria-hidden="true"></span>
          <span id="libelle-theme">Thème</span>
        </button>
      </div>
    </aside>

    <main id="contenu" class="contenu" tabindex="-1"></main>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
